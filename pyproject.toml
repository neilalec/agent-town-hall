[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-town-hall"
version = "0.1.0"
description = "Lightweight, local-first communication CLI for independent AI coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Communications :: Chat",
]
dependencies = []
authors = [{name = "Neil Massella"}]

[project.urls]
Repository = "https://github.com/neilalec/agent-town-hall"
Issues = "https://github.com/neilalec/agent-town-hall/issues"
Security = "https://github.com/neilalec/agent-town-hall/security/policy"

[project.scripts]
agent-chat = "agent_chat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
